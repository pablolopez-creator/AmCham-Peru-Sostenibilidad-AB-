<style>

</style>

<div class="top"><div class="in">
  <div class="brand">ANDINA <b>FOODS</b></div>
  <div class="steps" id="steps"></div>
  <span class="pill" id="sync"><span class="dot"></span><span id="syncTxt">Registro local</span></span>
  <button class="gear" id="openFac" type="button">Facilitador</button>
</div></div>
<main id="app"></main>
<div class="foot">Caso ficticio con fines docentes · INCAE Business School · AmCham Perú. Cifras en soles constantes; los resultados son estimaciones del modelo del caso, no estados financieros.</div>
<div id="layer"></div>
<script>
/* ======== Configuración previa del facilitador (opcional) ========
   Pegue aquí la URL del Web App de Google Apps Script y la clave para que todas las computadoras
   registren automáticamente en la misma hoja de Google Sheets. */
const PRESET = { sheetUrl: '', clave: '' };
</script>
<script>
/* ===== Andina Foods · Modelo de cálculo A+B (soles constantes, sin descuento) ===== */
const DEFAULT_CFG = {
  familias: 25, haFam: 2,
  yConv: 1.80, y1: 1.62, y2: 1.70, y3: 1.80,
  cConv: 7200, c1: 8000, c2: 7800, c3: 7500,
  inv: 1500, ahorro: 2000, pConv: 6000,
  opConv: 1500, opCert: 2100, ventaConv: 8700,
  setup: 90000,
  certs: {
    regenagri: { nombre: 'regenagri', inst: 12000, anual: 32000, anio: 3 },
    regenified: { nombre: 'Certified Regenified', inst: 18000, anual: 42000, anio: 3 },
    roc: { nombre: 'Regenerative Organic Certified (ROC)', inst: 65000, anual: 78000, anio: 4 }
  },
  nmRef: 11500, nmTecho: 11800, nmMin: 70, nmOpcionMax: 20,
  // Caso B
  grupos: [ { id: 'g1', nombre: 'Suelos mejor manejados', fam: 8, y: 1.62 },
            { id: 'g2', nombre: 'Familias promedio', fam: 12, y: 1.35 },
            { id: 'g3', nombre: 'Laderas expuestas', fam: 5, y: 0.92 } ],
  factorSinMedidas: 1.20 / 1.35, contingencia: 900, spot: 7300,
  aceptBase: 0.85, aceptMonitoreo: 0.05, aceptCapacitacion: 0.05,
  ventaParalela: { ninguna: 0.25, sancion: 0.10, sancion_bono: 0.03 },
  sac: 1000, umbralLiquidez: -1500, perdidaConvSequia: 0.30, yRecup: 1.80,
  // Reglas de la alianza: costo (se reparte según gobAndinaPct) y efecto
  gobComite: 3000,          // S/ por año, fijo (reuniones, viajes, actas)
  gobMonitoreo: 80,         // S/ por ha y año, años 1 a 5 (visitas de campo y registros por lote)
  gobCap1: 200, gobCap2: 100, // S/ por ha, capacitación en años 1 y 2
  comiteParalela: 0.70,     // el comité reduce la venta a acopiadores a 70% de lo que sería
  // Descomposición del costo regenerativo (Anexo 1): mano de obra extra y ahorro de insumos
  manoObraExtra: 1000, insumos1: 200, insumos2: 400, insumos3: 700,
  // Tiempos sugeridos por ronda (minutos) para una sesión de 60 minutos
  minR1: 5, minR2: 17, minR3: 15, minR4: 6, minCierre: 12, pistaR2: 10, pistaR3: 8,
  pin: 'incae'
};

const r0 = x => Math.round(x);
function sum(a) { return a.reduce((s, v) => s + v, 0); }

/* Distribuye las familias incluidas entre grupos: primero las más experimentadas */
function asignarGrupos(cfg, fam) {
  let rest = fam; return cfg.grupos.map(g => { const n = Math.max(0, Math.min(g.fam, rest)); rest -= n; return { ...g, fam: n }; });
}

/* Costo anual de las reglas de la alianza (total, antes de repartir) */
function costoGob(cfg, cl, t, ha) {
  cl = cl || {};
  return (cl.comite ? cfg.gobComite : 0) + (cl.monitoreo ? cfg.gobMonitoreo * ha : 0)
    + (cl.capacitacion ? (t === 1 ? cfg.gobCap1 : t === 2 ? cfg.gobCap2 : 0) * ha : 0);
}
const insumosEvitadosHa = (cfg, t) => t === 1 ? cfg.insumos1 : t === 2 ? cfg.insumos2 : cfg.insumos3;

/* Año típico desde el año 6, si la alianza se renueva en las mismas condiciones.
   Andina frente a seguir comprando en convencional; cada familia frente a seguir en convencional. */
function anioTipico(cfg, d, famActivas) {
  const fam = famActivas == null ? d.familias : famActivas;
  if (!fam || !d.nmAutoriza || (d.esquema === 'roc' && !d.nmAceptaRetraso)) return null;
  const ha = fam * cfg.haFam, tons = cfg.y3 * ha, toNM = Math.min(tons, cfg.nmMin + (d.nmExtra || 0)), exc = tons - toNM;
  const cert = cfg.certs[d.esquema].anual, certA = cert * d.certAndinaPct / 100;
  const gob = costoGob(cfg, d.clausulas, 6, ha), gobA = gob * (d.gobAndinaPct ?? 50) / 100;
  const andina = toNM * (d.nmPrecio - d.p35 - cfg.opCert) + exc * (cfg.ventaConv - d.pExc - cfg.opCert) - certA - gobA
    - cfg.yConv * ha * (cfg.ventaConv - cfg.pConv - cfg.opConv);
  const prod = toNM * d.p35 + exc * d.pExc - cfg.c3 * ha - (cert - certA) - (gob - gobA) - ha * (cfg.yConv * cfg.pConv - cfg.cConv);
  return { andina, familia: prod / fam };
}

/* ---------- Caso A: acuerdo de cinco años sin shock ---------- */
function calcA(cfg, d) {
  // d: {familias,p1,p2,p35,pExc,invAndinaPct,invModo:'anticipo'|'donacion',certAndinaPct,esquema,
  //     nmPrecio,nmExtra,nmAutoriza,nmAceptaRetraso,fondo (S/ por t por parte), clausulas:{...}}
  const ha = d.familias * cfg.haFam, cert = cfg.certs[d.esquema];
  const Y = [cfg.y1, cfg.y2, cfg.y3, cfg.y3, cfg.y3], C = [cfg.c1, cfg.c2, cfg.c3, cfg.c3, cfg.c3];
  const autoriza = d.nmAutoriza !== false;
  const anioCert = cert.anio > 3 ? (d.nmAceptaRetraso ? cert.anio : 99) : 3;
  const certCap = d.nmMin ?? cfg.nmMin;
  const nmTot = cfg.nmMin + (d.nmExtra || 0);
  const invTot = cfg.inv * ha, invA = invTot * d.invAndinaPct / 100, invP = invTot - invA;
  const nCert = Math.max(0, 5 - (Math.min(anioCert, 6) - 1));
  const recupAnual = d.invModo === 'anticipo' && invA > 0 ? invA / Math.max(1, Math.min(3, nCert || 3)) : 0;
  const base = cfg.yConv * cfg.pConv - cfg.cConv; // margen conv por ha
  const cl = d.clausulas || {}, gobPct = (d.gobAndinaPct ?? 50) / 100;
  const fondoOn = !!cl.fondo && (d.fondo || 0) > 0;
  const years = [];
  let fondoAportado = 0; // aporte de cada parte (Andina = asociación)
  for (let t = 1; t <= 5; t++) {
    const y = Y[t - 1], c = C[t - 1], tons = y * ha;
    const certificado = autoriza && t >= anioCert;
    let revP, gmA, toNM = 0, exc = 0, p;
    if (!certificado) {

/* ---------- Caso B: sequía en el año 3, sobre el acuerdo firmado ---------- */
function calcB(cfg, d, b) {
  // b: {medidas:bool, contAndinaPct, usarFondo:bool, apoyoG3 (S/ por familia), diferirAnticipo:bool,
  //     ajusteP3 (S/ por t), regla:'ninguna'|'sancion'|'sancion_bono', bono (S/ por t)}
  const A = calcA(cfg, d);
  const grupos = asignarGrupos(cfg, d.familias);
  const cl = d.clausulas || {};
  const acept = Math.min(1, cfg.aceptBase + (cl.monitoreo ? cfg.aceptMonitoreo : 0) + (cl.capacitacion ? cfg.aceptCapacitacion : 0));
  const cert = cfg.certs[d.esquema];

  let fraccionParalela = p3 >= cfg.spot ? 0 : (cfg.ventaParalela[b.regla] ?? 0.25);

  if (cl.comite) fraccionParalela *= cfg.comiteParalela;
  const fondo = 2 * A.fondoPorParte; // aportes ya cobrados en los años 1 y 2
  const contTotal = b.medidas ? cfg.contingencia * A.ha : 0;
  const deFondo = b.usarFondo ? Math.min(fondo, contTotal) : 0;
  const contRest = contTotal - deFondo;
  const contAndina = contRest * b.contAndinaPct / 100, contProd = contRest - contAndina;
  const contProdHa = A.ha ? contProd / A.ha : 0;
  const recupY3 = b.diferirAnticipo ? 0 : A.years[2].recup;
  const recupFam = recupY3 / d.familias;
  const certPFam = A.years[2].certP / d.familias;
  const gobPFam = A.years[2].gobP / d.familias; // parte de las familias en el costo de las reglas, año 3
  const factor = b.medidas ? 1 : cfg.factorSinMedidas;
  const planY45Fam = (A.years[3].prod) / d.familias; // margen planificado por familia en años 4-5 (con su recuperación)
  const convFam = (cfg.yConv * cfg.pConv - cfg.cConv) * cfg.haFam;
  const res = grupos.filter(g => g.fam > 0).map(g => {
    const y = g.y * factor;
    const sac = g.id === 'g3' ? cfg.sac * cfg.haFam : 0;
    const apoyo = g.id === 'g3' ? (b.apoyoG3 || 0) : 0;
    const margenY3 = y * cfg.haFam * p3 - (cfg.c3 + contProdHa) * cfg.haFam - recupFam - certPFam - gobPFam + sac + apoyo;
    // salida: vende al contado sin medidas, vuelve a convencional en años 4-5, devuelve saldo de anticipo
    const ySalida = g.y * cfg.factorSinMedidas;
    const saldoAnticipo = (d.invModo === 'anticipo' ? cfg.inv * cfg.haFam * d.invAndinaPct / 100 : 0); // saldo a devolver al salir
    const salida = ySalida * cfg.haFam * cfg.spot - cfg.c3 * cfg.haFam + sac + 2 * convFam - saldoAnticipo;
    const quedarse = margenY3 + 2 * planY45Fam;
    const sale = margenY3 < cfg.umbralLiquidez || quedarse < salida;
    const motivo = margenY3 < cfg.umbralLiquidez ? 'liquidez' : quedarse < salida ? 'conveniencia' : null;
    return { ...g, y, margenY3, quedarse, salida, sale, motivo };
  });
  const quedan = res.filter(g => !g.sale);
  const famQuedan = sum(quedan.map(g => g.fam));
  const cosecha = sum(quedan.map(g => g.y * g.fam * cfg.haFam));

  const conforme = (cosecha - paralela) * acept;

  const haQ3 = famQuedan * cfg.haFam;
  const perdidaAlianza = haQ3 ? 1 - cosecha / (cfg.y3 * haQ3) : null;
  return { A, grupos: res, famQuedan, cosecha, paralela, fraccionParalela, acept, conforme, deficit, p3,

/* ---------- Cierre: cinco años con el resultado de la sequía y la decisión de NordMarkt ---------- */
function calcFinal(cfg, d, b, nm) {

      prodQ = toNM * d.p35 + exc * d.pExc - cfg.c3 * haQ - certP - recup;

    andina += cfg.yConv * haS * (cfg.ventaConv - cfg.pConv - cfg.opConv);

function barChart(years, series, opts = {}) {
  const W = 560, H = 210, P = { l: 58, r: 10, t: 14, b: 28 }, n = years.length, k = series.length;
  const vals = series.flatMap(s => s.data); let mx = Math.max(0, ...vals), mn = Math.min(0, ...vals);
  if (mx === mn) mx = mn + 1; const pad = (mx - mn) * 0.08; mx += pad; mn -= mn < 0 ? pad : 0;
  const y = v => P.t + (mx - v) / (mx - mn) * (H - P.t - P.b);
  const bw = (W - P.l - P.r) / n, gw = bw * 0.72, sw = gw / k;
  let g = '';
  const ticks = 4; for (let i = 0; i <= ticks; i++) { const v = mn + (mx - mn) * i / ticks; g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="#ece6d8"/><text x="${P.l - 6}" y="${y(v) + 4}" font-size="10" text-anchor="end" fill="#7a786f">${miles(Math.round(v / 1000))}k</text>`; }
  g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(0)}" y2="${y(0)}" stroke="#9a937f"/>`;
  years.forEach((lab, i) => {
    const x0 = P.l + i * bw + (bw - gw) / 2;
    series.forEach((s, j) => { const v = s.data[i], yy = Math.min(y(v), y(0)), h = Math.abs(y(v) - y(0));
      g += `<rect x="${x0 + j * sw + 1}" y="${yy}" width="${sw - 2}" height="${Math.max(1, h)}" rx="3" fill="${s.color}" ${s.dash ? 'fill-opacity=".35" stroke="' + s.color + '" stroke-dasharray="3 2"' : ''}><title>${s.name} · ${lab}: ${S(v)}</title></rect>`; });
    g += `<text x="${P.l + i * bw + bw / 2}" y="${H - 8}" font-size="11" text-anchor="middle" fill="#5d6b63">${lab}</text>`;
  });
  if (opts.shock != null) { const x = P.l + opts.shock * bw; g += `<rect x="${x}" y="${P.t}" width="${bw}" height="${H - P.t - P.b}" fill="#d6a03c" opacity=".12"/><text x="${x + bw / 2}" y="${P.t + 10}" font-size="10" text-anchor="middle" fill="#9a6a12">sequía</text>`; }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'Gráfico')}">${g}</svg>
  <div class="legend">${series.map(s => `<span><i style="background:${s.color}${s.dash ? ';opacity:.45' : ''}"></i>${s.name}</span>`).join('')}</div>`;
}

/* ================== eventos ================== */
function invalidate(r) {
  ST.ratif['r' + r] = {};
  if (r >= 1 && r <= 3) delete ST.calc['r' + r];
  if (r === 3 || r === 4) ST.calc.r4 = null;
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'mesa') { ST.mesa = t.value; save(); const b = $('empezar'); if (b) b.disabled = !t.value.trim(); return; }
  if (t.dataset.rep) { ST.reps[t.dataset.rep] = t.value; save(); return; }
  if (t.dataset.text) { setPath(t.dataset.text, t.value); save(); return; }
  if (t.dataset.path) { const v = +t.value; setPath(t.dataset.path, v); const lab = $('v_' + t.dataset.path); if (lab) lab.textContent = FMT[t.dataset.fmt](v);
    if (t.dataset.path === 'acuerdo.p35' && !ST.acuerdo.pExcLibre) ST.acuerdo.pExc = v;
    if (t.dataset.path === 'acuerdo.pExc') ST.acuerdo.pExcLibre = true; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.path) { invalidate(ST.ronda); save(); render(); }
  if (t.dataset.chk) { setPath(t.dataset.chk, t.checked); if (t.dataset.chk.startsWith('acuerdo.clausulas.')) ST.acuerdo.paquete = 'personalizado'; invalidate(ST.ronda); save(); render(); }
  if (t.dataset.comp) { const k = t.dataset.comp; ST.r4.compromisos = t.checked ? [...new Set([...ST.r4.compromisos, k])] : ST.r4.compromisos.filter(x => x !== k); ST.ratif.r4 = {}; save(); render(); }
});
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.go) { go(+b.dataset.go); return; }
  if (b.dataset.seg) { setPath(b.dataset.seg, JSON.parse(b.dataset.val)); invalidate(ST.ronda); save(); render(); return; }
  if (b.dataset.pkg) { ST.acuerdo.paquete = b.dataset.pkg; aplicarPaquete(b.dataset.pkg); invalidate(ST.ronda); save(); render(); return; }
  if (b.dataset.toggle) { ST.ui[b.dataset.toggle] = !ST.ui[b.dataset.toggle]; save(); render(); return; }
  if (b.id === 'verPista') { ST.ui['pistaR' + ST.ronda] = true; log(`Pista abierta en la ronda ${ST.ronda}`); enviar('pista_R' + ST.ronda); save(); render(); return; }
  if (b.dataset.retira) { ST.retiroUI.quien = ST.retiroUI.quien === b.dataset.retira ? '' : b.dataset.retira; save(); render(); return; }
  if (b.dataset.ratif) { const [r, x] = b.dataset.ratif.split('.'); ST.ratif[r][x] = !ST.ratif[r][x]; save(); render(); return; }
  switch (b.id) {
    case 'empezar': log('Inicio de la mesa'); enviar('inicio'); go(1); break;
    case 'calcular': calcular(); break;
    case 'aR2': ST.acuerdo.nmPrecio = CFG.nmRef; go(2); break;
    case 'firmar': ST.firmado = clone(ST.acuerdo); ST.sinAcuerdoA = false; log('Acuerdo A firmado'); enviar('acuerdo_firmado'); save(); go(3); break;
    case 'confirmarRetiro': ST.retiro = { quien: ST.retiroUI.quien, motivo: ST.retiroUI.motivo, ronda: 2, propuesta: clone(ST.acuerdo) }; ST.firmado = null;
      log(`Sin acuerdo: ${ROLES[ST.retiro.quien]} se retira`); enviar('sin_acuerdo_retiro', { quien: ST.retiro.quien, motivo: ST.retiro.motivo }); save(); go(5); break;
    case 'retomar': log('La mesa retoma la negociación tras un retiro'); enviar('retoma_negociacion'); ST.retiro = null; ST.retiroUI = { quien: '', motivo: '' }; save(); render(); break;
    case 'cancelarRetiro': ST.retiroUI = { quien: '', motivo: '' }; save(); render(); break;
    case 'verImpacto': ST.revelado = true; log('Revelación de la sequía'); enviar('revelacion_B'); save(); render(); break;
    case 'aR4': go(4); break;
    case 'aCierre': go(5); break;
    case 'enviarCierre': log('Cierre registrado'); enviar('cierre'); save(); b.textContent = 'Cierre registrado ✓'; break;
    case 'copiarEstado': copiar(JSON.stringify(estadoFinal(), null, 2)); break;
    case 'descargarEstado': descargar(); break;
    case 'openFac': abrirFacilitador(); break;
  }
});
function calcular() {
  const r = ST.ronda;
  ST.intentos['r' + r] = (ST.intentos['r' + r] || 0) + 1;
  if (r === 1 || r === 2) {
    const a = clone(ST.acuerdo);
    if (r === 1) Object.assign(a, { nmPrecio: CFG.nmRef, nmExtra: 0, nmAutoriza: true, nmAceptaRetraso: false });
    const res = calcA(CFG, a); res.acuerdo = a; ST.calc['r' + r] = res;
    log(`R${r} intento ${ST.intentos['r' + r]}: Andina ${Ssigned(res.andinaVsVara)} vs vara; familia ${Ssigned(res.prodFam5)}; NM ${res.cond.nordmarkt ? 'cumple' : 'no cumple'}`);
    enviar('calculo_R' + r, { acuerdo: a, andinaVsVara: Math.round(res.andinaVsVara), prodFam5: Math.round(res.prodFam5), cond: res.cond });
  } else if (r === 3) {
    const res = calcB(CFG, acuerdoVigente(), ST.b); ST.calc.r3 = res; ST.calc.r4 = null; ST.ratif.r4 = {};
    log(`R3 intento ${ST.intentos.r3}: siguen ${res.famQuedan} familias; conforme ${t1(res.conforme)} t; déficit ${t1(res.deficit)} t`);
    enviar('calculo_R3', { b: ST.b, conforme: +res.conforme.toFixed(1), deficit: +res.deficit.toFixed(1), famQuedan: res.famQuedan });
  } else if (r === 4) {
    const nm = { concede: ST.calc.r3.deficit <= 0 ? true : !!ST.r4.concede, mantieneOpcion: ST.r4.mantieneOpcion };
    const res = calcFinal(CFG, acuerdoVigente(), ST.b, nm); ST.calc.r4 = res;
    log(`R4: NordMarkt ${res.continua ? 'mantiene' : 'termina'} la alianza; Andina ${Ssigned(res.andinaVsVara)}; familia ${Ssigned(res.prodFamVsConv)}`);
    enviar('resultado_final');
  }
  save(); render();
}
async function copiar(txt) {
  try { await navigator.clipboard.writeText(txt); const c = $('copiado'); if (c) c.textContent = 'Copiado'; }
  catch (e) { mostrarTexto(txt); }
}
function descargar() {
  let enMarco = true; try { enMarco = window.self !== window.top; } catch (e) { }
  if (enMarco) { mostrarTexto(JSON.stringify(estadoFinal(), null, 2)); return; }
  try {
    const blob = new Blob([JSON.stringify(estadoFinal(), null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'andina-estado-' + (ST.mesa || 'mesa').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.json';
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { mostrarTexto(JSON.stringify(estadoFinal(), null, 2)); }
}
function mostrarTexto(txt) {
  $('layer').innerHTML = `<div class="overlay"><div class="modal"><h2>Copien este texto</h2><textarea style="min-height:320px" class="mono" readonly>${esc(txt)}</textarea><div class="row" style="margin-top:10px"><button class="btn" type="button" id="cerrarLayer">Cerrar</button></div></div></div>`;
  $('cerrarLayer').onclick = () => { $('layer').innerHTML = ''; };
}

/* ================== panel del facilitador ================== */
const PARAMS = [
  ['yConv', 'Rendimiento convencional (t/ha)'], ['y1', 'Rendimiento año 1'], ['y2', 'Rendimiento año 2'], ['y3', 'Rendimiento años 3 a 5'],
  ['cConv', 'Costo convencional (S/ha)'], ['c1', 'Costo año 1'], ['c2', 'Costo año 2'], ['c3', 'Costo años 3 a 5'],
  ['inv', 'Inversión de transición (S/ha)'], ['ahorro', 'Ahorro por familia'], ['pConv', 'Precio convencional al productor'],
  ['opConv', 'Operación Andina convencional (S/t)'], ['opCert', 'Operación Andina certificada (S/t)'], ['ventaConv', 'Venta convencional (S/t)'],
  ['setup', 'Instalación del programa'], ['nmRef', 'Referencia NordMarkt (S/t)'], ['nmTecho', 'Techo NordMarkt (S/t)'], ['nmMin', 'Mínimo NordMarkt (t)'],
  ['nmOpcionMax', 'Opción máxima adicional (t)'], ['contingencia', 'Contingencia sequía (S/ha)'], ['spot', 'Precio de acopiadores (S/t)'],
  ['factorSinMedidas', 'Factor de rendimiento sin medidas'], ['aceptBase', 'Aceptación base de lotes'], ['aceptMonitoreo', '+ aceptación por monitoreo'],
  ['aceptCapacitacion', '+ aceptación por capacitación'], ['sac', 'Seguro agrícola (S/ha, grupo 3)'], ['umbralLiquidez', 'Umbral de caja para salir (S/familia)'],
  ['perdidaConvSequia', 'Pérdida convencional por sequía'], ['yRecup', 'Rendimiento años 4 y 5 tras la sequía'],
  ['gobComite', 'Comité: costo anual (S/)'], ['gobMonitoreo', 'Monitoreo: costo por ha y año (S/)'], ['gobCap1', 'Capacitación año 1 (S/ por ha)'],
  ['gobCap2', 'Capacitación año 2 (S/ por ha)'], ['comiteParalela', 'Comité: venta a acopiadores (fracción que queda)'],
  ['minR1', 'Minutos ronda 1'], ['minR2', 'Minutos ronda 2'], ['minR3', 'Minutos ronda 3'], ['minR4', 'Minutos ronda 4'], ['minCierre', 'Minutos cierre'],
  ['pistaR2', 'Pista ronda 2: minuto en que aparece'], ['pistaR3', 'Pista ronda 3: minuto en que aparece'],
  ['manoObraExtra', 'Mano de obra extra regenerativa (S/ha, informativo)'], ['insumos1', 'Insumos evitados año 1 (S/ha)'], ['insumos2', 'Insumos evitados año 2 (S/ha)'], ['insumos3', 'Insumos evitados años 3 a 5 (S/ha)']
];
let facTab = 'guia';
function abrirFacilitador() {
  if (!store.get('andina.facOK', false)) {
    $('layer').innerHTML = `<div class="overlay"><div class="modal" style="max-width:420px"><h2>Panel del facilitador</h2><div class="field"><label>Clave</label><input type="password" id="pin"></div><div class="row"><button class="btn" type="button" id="pinOK">Entrar</button><button class="btn ghost" type="button" id="cerrarLayer">Cancelar</button></div><div class="small" id="pinErr"></div></div></div>`;
    $('cerrarLayer').onclick = () => { $('layer').innerHTML = ''; };
    $('pinOK').onclick = () => { if ($('pin').value === CFG.pin) { store.set('andina.facOK', true); abrirFacilitador(); } else $('pinErr').textContent = 'Clave incorrecta.'; };
    return;
  }
  const tab = { guia: facGuia, mesas: facMesas, parametros: facParametros, conexion: facConexion, mesa: facMesa }[facTab]();
  $('layer').innerHTML = `<div class="overlay"><div class="modal"><div class="row" style="justify-content:space-between"><h2>Panel del facilitador</h2><button class="btn ghost" type="button" id="cerrarFac">Cerrar</button></div>
   <div class="tabs">${[['guia', 'Guía'], ['mesas', 'Todas las mesas'], ['parametros', 'Parámetros'], ['conexion', 'Google Sheets'], ['mesa', 'Esta mesa']].map(([k, t]) => `<button type="button" data-tab="${k}" class="${facTab === k ? 'on' : ''}">${t}</button>`).join('')}</div>${tab}</div></div>`;
  $('cerrarFac').onclick = () => { $('layer').innerHTML = ''; render(); };
  $('layer').querySelectorAll('[data-tab]').forEach(x => x.onclick = () => { facTab = x.dataset.tab; abrirFacilitador(); });
  bindFac();
}
function facGuia() {
  const ref = calcA(CFG, ACUERDO_REFERENCIA);
  return `<h3>Agenda de 60 minutos</h3>
  <table class="tbl"><tr><th>Minuto</th><th>Etapa</th><th>Qué hace el facilitador</th></tr>
  <tr><td>0–3</td><td>Inicio</td><td>Roles y pantalla. La pre-lectura se hizo antes.</td></tr>
  <tr><td>3–${3 + CFG.minR1}</td><td>Ronda 1 · bilateral</td><td>Un intento basta: el objetivo es ver que, sin NordMarkt, no alcanza.</td></tr>
  <tr><td>${3 + CFG.minR1}–${3 + CFG.minR1 + CFG.minR2}</td><td>Ronda 2 · tripartita</td><td>A los ${CFG.pistaR2} minutos (o tras 3 intentos fallidos) la pantalla ofrece una pista. En el minuto 25, las mesas sin acuerdo pasan con los términos de referencia (pestaña «Esta mesa»).</td></tr>
  <tr><td>25–27</td><td>Revelación</td><td>La pantalla muestra la sequía.</td></tr>
  <tr><td>27–${27 + CFG.minR3}</td><td>Ronda 3 · sequía</td><td>Tres decisiones: contingencia, laderas y venta a acopiadores. Pista disponible a los ${CFG.pistaR3} minutos.</td></tr>
  <tr><td>${27 + CFG.minR3}–${27 + CFG.minR3 + CFG.minR4}</td><td>Ronda 4 · NordMarkt</td><td>NordMarkt decide con su criterio confidencial.</td></tr>
  <tr><td>${27 + CFG.minR3 + CFG.minR4}–60</td><td>Cierre</td><td>Matriz de valor con la columna de suelo, agua y comunidad.</td></tr></table>
  <div class="note"><b>Pista de la ronda 2:</b> ${PISTAS[2]}<br><b>Pista de la ronda 3:</b> ${PISTAS[3]}</div>
  <div class="note"><b>Criterio sugerido para NordMarkt (hoja confidencial):</b> aprobar la excepción solo si el déficit es de hasta 10% del mínimo (${t1(CFG.nmMin * 0.9)} t conformes o más) y la propuesta trae al menos tres compromisos verificables. Más allá de eso, la decisión es de quien representa a NordMarkt.</div>
  <table class="tbl"><tr><th>Lo esperable</th><th>Con las cifras actuales</th></tr>
  <tr><td>Ronda 1: acuerdo solo bilateral</td><td>No alcanza a la vez la vara de Andina y la conveniencia de las familias con NordMarkt a S/11.500 y 70 t.</td></tr>
  <tr><td>Ronda 2: acuerdo tripartito de referencia (E2′)</td><td>Andina ${Ssigned(ref.andinaVsVara)} frente a la vara; familia ${Ssigned(ref.prodFam5)} en cinco años.</td></tr>
  <tr><td>Reglas de la alianza (rondas 1 y 2)</td><td>Tienen costo: comité ${S(CFG.gobComite)}/año, monitoreo ${S(CFG.gobMonitoreo)}/ha/año, capacitación ${S(CFG.gobCap1)} y ${S(CFG.gobCap2)}/ha en los años 1 y 2. Con todas, unos ${S(5 * CFG.gobComite + 5 * CFG.gobMonitoreo * 50 + (CFG.gobCap1 + CFG.gobCap2) * 50)} en cinco años para 50 ha. El fondo se cobra en los años 1 y 2 y se devuelve en el año 5 si no se usa. Marcarlas todas ya no es gratis.</td></tr>
  <tr><td>Ronda 3: sin reglas de gobernanza</td><td>Venta a acopiadores del ${Math.round(CFG.ventaParalela.ninguna * 100)}% y aceptación de ${Math.round(CFG.aceptBase * 100)}%: déficit grande. Monitoreo, capacitación y sanciones con bono lo reducen a pocas toneladas. Si el precio del año 3 iguala o supera los ${S(CFG.spot)}/t de los acopiadores, nadie vende fuera, haya o no sanciones.</td></tr>
  <tr><td>Ronda 3: quién paga la contingencia</td><td>Si las familias pagan todo, el grupo de laderas cae bajo el umbral de caja y sale.</td></tr></table>
  <h3 style="margin-top:14px">Términos de referencia para mesas sin acuerdo</h3><p class="sub">Una mesa sin acuerdo termina en un cierre propio. Solo si usted lo decide, puede seguir al Caso B con estos términos desde la pestaña «Esta mesa».</p>
  <table class="tbl"><tr><th>Tema</th><th>Término</th></tr>
  <tr><td>Participación</td><td>${ACUERDO_REFERENCIA.familias} familias, ${ACUERDO_REFERENCIA.familias * CFG.haFam} ha</td></tr>
  <tr><td>Precio al productor</td><td>${S(ACUERDO_REFERENCIA.p1)}/t año 1 · ${S(ACUERDO_REFERENCIA.p2)}/t año 2 · ${S(ACUERDO_REFERENCIA.p35)}/t certificada años 3 a 5</td></tr>
  <tr><td>Toneladas certificadas que NordMarkt no compre</td><td>${S(ACUERDO_REFERENCIA.pExc)}/t</td></tr>
  <tr><td>Inversión de transición</td><td>Andina adelanta el 100% y lo recupera en tres cuotas en los años 3 a 5</td></tr>
  <tr><td>Certificación</td><td>regenagri, pagada al 100% por Andina</td></tr>
  <tr><td>NordMarkt</td><td>${S(ACUERDO_REFERENCIA.nmPrecio)}/t FOB Callao · 70 t firmes + opción sobre ${ACUERDO_REFERENCIA.nmExtra} t</td></tr>
  <tr><td>Reglas de la alianza</td><td>Solo cláusula de revisión ante eventos climáticos extraordinarios (sin costo)</td></tr>
  <tr><td>Resultado sin sequía</td><td>Andina ${Ssigned(ref.andinaVsVara)} frente a la vara · familia ${Ssigned(ref.prodFam5)} en cinco años</td></tr></table>`;
}
function facMesas() {
  return `<p class="sub">Lee el último estado de cada mesa desde Google Sheets (requiere la URL del Web App). También pueden pegar archivos de estado.</p>
  <div class="row"><button class="btn" type="button" id="cargarMesas" ${CONN.sheetUrl ? '' : 'disabled'}>Cargar desde Sheets</button><span class="small" id="mesasMsg"></span></div>
  <div class="field"><label>O peguen uno o varios estados (JSON, uno por línea o una lista)</label><textarea id="pegarEstados" class="mono"></textarea><button class="btn ghost" type="button" id="verPegados">Mostrar</button></div>
  <div id="tablaMesas"></div>`;
}
function tablaMesas(list) {
  if (!list.length) return '<div class="empty"><b>Sin mesas</b>Todavía no hay estados registrados.</div>';
  return `<div class="scroll"><table class="tbl"><tr><th>Mesa</th><th>Acuerdo A</th><th>Andina vs vara (A)</th><th>Familias</th><th>Conforme / déficit</th><th>NordMarkt</th><th>Andina final</th><th>Familia final</th><th>Ha regenerativas año 5</th></tr>
  ${list.map(e => { const a = e.acuerdoA?.terminos || {}, r = e.resultadoB, f = e.economia5anios, n = e.nordmarkt;
    return `<tr><td><b>${esc(e.mesa)}</b></td><td>${e.acuerdoA?.retiro && !e.acuerdoA?.firmado ? `Sin acuerdo: se retira ${esc(ROLES[e.acuerdoA.retiro.quien] || e.acuerdoA.retiro.quien)}` : a.p35 ? `${S(a.p35)} · ${esc(a.esquema)} · NM ${S(a.nmPrecio)}${a.nmExtra ? ' +' + a.nmExtra + 't' : ''}${e.acuerdoA.porDefecto ? ' (ref.)' : ''}` : '—'}</td>
    <td class="n">${e.resumen?.A_andinaVsVara != null ? Ssigned(e.resumen.A_andinaVsVara) : '—'}</td><td class="n">${r ? r.familiasQuedan + '/' + (r.familiasQuedan + r.familiasSalen) : '—'}</td>
    <td class="n">${r ? t1(r.conforme_t) + ' / ' + t1(r.deficit_t) + ' t' : '—'}</td><td>${n ? (n.alianzaContinua ? 'Continúa' : 'Termina') : '—'}</td>
    <td class="n">${f ? Ssigned(f.andinaVsVara) : '—'}</td><td class="n">${f ? Ssigned(f.porFamiliaVsConv) : '—'}</td><td class="n">${e.sueloAguaComunidad ? e.sueloAguaComunidad.hectareasRegenerativasAnio5 + ' ha' : '—'}</td></tr>`; }).join('')}</table></div>`;
}
function facParametros() {
  return `<p class="sub">Cambios guardados en esta computadora. Para usar los mismos parámetros en todas, copien la configuración y péguenla en cada una.</p>
  <div class="params">${PARAMS.map(([k, l]) => `<label>${l}<input type="number" step="any" data-cfg="${k}" value="${CFG[k]}"></label>`).join('')}</div>
  <h3 style="margin-top:14px">Certificaciones</h3><div class="params">${Object.entries(CFG.certs).map(([k, c]) => `<label>${esc(c.nombre)} · instalación<input type="number" data-cert="${k}.inst" value="${c.inst}"></label><label>${esc(c.nombre)} · anual<input type="number" data-cert="${k}.anual" value="${c.anual}"></label><label>${esc(c.nombre)} · primer año<input type="number" data-cert="${k}.anio" value="${c.anio}"></label>`).join('')}</div>
  <div class="row" style="margin-top:12px"><button class="btn" type="button" id="guardarCfg">Guardar parámetros</button><button class="btn ghost" type="button" id="copiarCfg">Copiar configuración</button><button class="btn ghost" type="button" id="restaurarCfg">Restaurar valores del caso</button></div>
  <div class="field"><label>Pegar configuración</label><textarea id="pegarCfg" class="mono"></textarea><button class="btn ghost" type="button" id="aplicarCfg">Aplicar</button></div>`;
}
function facConexion() {
  return `<p class="sub">Cada evento de la mesa (cálculos, firma, revelación, resultado y cierre) se envía a la hoja. Si no hay internet, quedan en cola y se reenvían.</p>
  <div class="field"><label>URL del Web App de Google Apps Script</label><input type="text" id="sheetUrl" value="${esc(CONN.sheetUrl)}" placeholder="https://script.google.com/macros/s/…/exec"></div>
  <div class="field"><label>Clave compartida (la misma que en el script)</label><input type="text" id="clave" value="${esc(CONN.clave)}"></div>
  <div class="row"><button class="btn" type="button" id="guardarConn">Guardar y probar</button><span class="small">Eventos en cola: ${queue.length}</span></div>
  <div class="note warn">Por seguridad, la vista previa publicada en Claude no puede enviar datos a Google. El registro funciona con el archivo HTML abierto en el navegador o alojado en un sitio web.</div>`;
}
function facMesa() {
  return `<div class="row"><button class="btn ghost" type="button" id="irRonda">Desbloquear todas las rondas</button><button class="btn ghost" type="button" id="cargarRef">Cargar acuerdo de referencia</button>${!ST.firmado ? '<button class="btn ghost" type="button" id="continuarRef">Continuar al Caso B con términos de referencia</button>' : ''}<button class="btn ghost" type="button" id="reiniciar">Reiniciar esta mesa</button></div>
  <div class="small" style="margin-top:10px">Mesa: <b>${esc(ST.mesa || '—')}</b> · ronda ${ST.ronda} · intentos ${JSON.stringify(ST.intentos)}</div>
  <h3 style="margin-top:12px">Estado actual</h3><textarea class="mono" style="min-height:220px" readonly>${esc(JSON.stringify(estadoFinal(), null, 2))}</textarea>`;
}
function bindFac() {
  const on = (id, f) => { const el = $(id); if (el) el.onclick = f; };
  on('guardarCfg', () => {
    document.querySelectorAll('[data-cfg]').forEach(i => { CFG[i.dataset.cfg] = +i.value; });
    document.querySelectorAll('[data-cert]').forEach(i => { const [k, f] = i.dataset.cert.split('.'); CFG.certs[k][f] = +i.value; });
    store.set('andina.cfg', CFG); abrirFacilitador();
  });
  on('copiarCfg', () => copiar(JSON.stringify(CFG)));
  on('restaurarCfg', () => { CFG = clone(DEFAULT_CFG); store.del('andina.cfg'); abrirFacilitador(); });
  on('aplicarCfg', () => { try { CFG = deepMerge(DEFAULT_CFG, JSON.parse($('pegarCfg').value)); store.set('andina.cfg', CFG); abrirFacilitador(); } catch (e) { $('pegarCfg').value = 'Texto no válido'; } });
  on('guardarConn', () => { CONN.sheetUrl = $('sheetUrl').value.trim(); CONN.clave = $('clave').value.trim(); store.set('andina.conn', CONN); enviar('prueba_conexion'); abrirFacilitador(); });
  on('cargarMesas', async () => {
    $('mesasMsg').textContent = 'Cargando…';
    try { const r = await fetch(CONN.sheetUrl + (CONN.sheetUrl.includes('?') ? '&' : '?') + 'clave=' + encodeURIComponent(CONN.clave)); const data = await r.json();
      $('tablaMesas').innerHTML = tablaMesas(data); $('mesasMsg').textContent = data.length + ' mesas'; }
    catch (e) { $('mesasMsg').textContent = 'No se pudo leer la hoja. Revisen la URL y que el Web App sea accesible para cualquiera.'; }
  });
  on('verPegados', () => {
    const raw = $('pegarEstados').value.trim(); let list = [];
    try { const v = JSON.parse(raw); list = Array.isArray(v) ? v : [v]; } catch (e) { list = raw.split('\n').filter(Boolean).map(l => { try { return JSON.parse(l); } catch (x) { return null; } }).filter(Boolean); }
    $('tablaMesas').innerHTML = tablaMesas(list);
  });
  on('irRonda', () => { ST.max = 5; save(); abrirFacilitador(); });
  on('continuarRef', () => { ST.firmado = clone(ACUERDO_REFERENCIA); ST.sinAcuerdoA = true; ST.acuerdo = clone(ACUERDO_REFERENCIA); log('Facilitador: continúa al Caso B con términos de referencia'); enviar('continua_con_referencia'); save(); $('layer').innerHTML = ''; go(3); });
  on('cargarRef', () => { ST.acuerdo = clone(ACUERDO_REFERENCIA); save(); abrirFacilitador(); });
  on('reiniciar', function () { if (this.dataset.c !== '1') { this.dataset.c = '1'; this.textContent = 'Confirmar reinicio'; return; } ST = estadoNuevo(); save(); $('layer').innerHTML = ''; render(); });
}

render(); flush();
})();

</script>
</body>
